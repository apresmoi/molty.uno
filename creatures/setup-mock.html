<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molty setup options</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root {
  --bg:#000; --panel:#0a0c0b; --line:#1d2320; --ink:#d8e2dc; --dim:#7d8a83; --faint:#39423d;
  --accent:#9fe8c4; --accent-ink:#001a0e; --warn:#ffcf7a;
  --mono: ui-monospace,"SF Mono",Menlo,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
.stage>*{min-width:0}
body{font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.switch{position:sticky;top:0;z-index:5;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 16px;background:#050706;border-bottom:1px solid var(--line);font:12px var(--mono)}
.switch button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--dim)}
.switch button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.switch .reset{margin-left:12px}
.why{max-width:520px;margin:10px auto 0;padding:0 16px;text-align:center;color:var(--faint);font:12px var(--mono)}
.stage{min-height:calc(100vh - 80px);display:flex;justify-content:center;padding:24px 16px 60px}

/* shared bits */
.big{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-weight:600;font-size:17px;background:var(--accent);color:var(--accent-ink)}
.big:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:0;color:var(--dim);padding:10px;font-size:14px;display:block;margin:6px auto 0}
.list{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16px}
.opt:hover{border-color:var(--accent)}
.opt .meta{color:var(--dim);font:13px var(--mono)}
input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;outline:none}
input:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 8px 10px;text-align:center}
.tile:hover,.tile.on{border-color:var(--accent)}
.tile .n{font-size:15px}
.agents{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agents .tile{padding:22px 10px}
.agents .ic{font:28px var(--mono);color:var(--accent);display:block;margin-bottom:6px}
.copy{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 16px;display:flex;gap:10px;align-items:center}
.copy code{flex:1;min-width:0;font:13px/1.45 var(--mono);color:var(--ink);white-space:pre-wrap;word-break:break-all;max-height:4.4em;overflow:hidden}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px}
.msg pre{margin:0 0 14px;font:14px/1.6 var(--mono);color:var(--ink);white-space:pre-wrap;word-break:break-word}
.msg .big.done{background:var(--faint);color:var(--ink)}
.copy button{flex:none;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 14px}
.copy button.done{background:var(--faint);color:var(--ink)}
.num{display:flex;gap:12px;align-items:flex-start;margin:0 0 18px}
.num>b{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:13px var(--mono)}
.num>div{flex:1;min-width:0}
.num .lbl{margin:2px 0 8px;font-weight:600}
.num .sub{color:var(--dim);font-size:13px;margin:-4px 0 8px}
.wait{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--dim);font-size:14px;padding:12px 0}
.spin{font:18px var(--mono);color:var(--accent)}
.code4{font:600 54px/1 var(--mono);letter-spacing:.12em;color:var(--accent);text-align:center;margin:14px 0}
.adv{margin-top:22px;color:var(--faint);font-size:13px;text-align:center}
.adv summary{cursor:pointer;color:var(--dim);list-style:none}
.adv .box{margin-top:10px;text-align:left;font:12px/1.7 var(--mono);color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.check{font:64px/1 var(--mono);color:var(--accent);text-align:center;margin:10px 0}
.sim{display:block;margin:14px auto 0;background:none;border:1px dashed var(--faint);border-radius:999px;color:var(--faint);font:11px var(--mono);padding:4px 10px}

/* ── A: one card ─────────────────────────────── */
.A{width:100%;max-width:440px}
.A .dots{display:flex;gap:6px;justify-content:center;margin:6px 0 28px}
.A .dots i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.A .dots i.on{background:var(--accent)}
.A h1{font-size:28px;line-height:1.15;margin:0 0 8px;text-align:center;letter-spacing:-.02em}
.A .hint{color:var(--dim);text-align:center;margin:0 0 24px;font-size:15px}
.A .foot{margin-top:22px}

/* ── B: molty talks ──────────────────────────── */
.B{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.fstage{display:flex;justify-content:center;margin:0 auto 20px}
.molty-screen{display:block;border-radius:50%;box-shadow:0 0 0 8px #0b0d0c,0 0 0 9px var(--line);background:#000;cursor:pointer}
.tile img{display:block;width:96px;height:96px;margin:0 auto 6px;border-radius:50%;background:#000}
.tile .ph{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;background:#050706;display:grid;place-items:center;color:var(--faint);font:12px var(--mono)}
.grid{max-height:420px;overflow-y:auto;padding:2px}
.B .bubble{margin:20px 0 22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px;font-size:19px;line-height:1.35;text-align:center;position:relative;max-width:360px}
.B .bubble:before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.B .bubble small{display:block;color:var(--dim);font-size:13px;margin-top:4px}
.B .body{width:100%}
.B .prog{color:var(--faint);font:12px var(--mono);margin-top:18px}

/* ── C: checklist ────────────────────────────── */
.C{width:100%;max-width:520px}
.C h1{font-size:24px;margin:0 0 4px}
.C .top{color:var(--dim);margin:0 0 20px;font-size:15px}
.C .step{border:1px solid var(--line);border-radius:16px;margin:0 0 10px;background:var(--panel)}
.C .step .hd{display:flex;align-items:center;gap:14px;padding:16px}
.C .step .hd b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--faint);color:var(--dim);font:13px var(--mono);flex:none}
.C .step .hd .t{flex:1;font-weight:600}
.C .step .hd .s{color:var(--dim);font-size:14px}
.C .step.done .hd b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.C .step.todo{opacity:.45}
.C .step.here{border-color:var(--accent)}
.C .step.here .hd b{border-color:var(--accent);color:var(--accent)}
.C .step .bd{padding:0 16px 18px}
.C .step .bd .q{font-size:15px;color:var(--dim);margin:-6px 0 14px 44px}
.C .edit{background:none;border:0;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="switch" id="switch"></div>
<p class="why" id="why"></p>
<div class="stage" id="stage"></div>

<script type="module">
import { FluidStage, renderThumbs, CUTE_CATALOG } from './js/setup/fluid-stage.js';
// ── fake data ─────────────────────────────────────
const NETS = [{ssid:'Fortunatti',rssi:'▂▄▆█',lock:true},{ssid:'FRITZ!Box 7590',rssi:'▂▄▆_',lock:true},{ssid:'Vodafone-Guest',rssi:'▂▄__',lock:false},{ssid:'DIRECT-printer',rssi:'▂___',lock:true}];
const CREATURES = CUTE_CATALOG.map(c=>({id:c.id, n:c.name}));
const THUMBS = {};
const DEV = {id:'molty-k7m2w9c4ya', code:'K7M2W9C4', relay:'https://molty-relay.example.workers.dev'};   // mock values
const MCP = DEV.relay + '/mcp';
const MSG = `Hi! Please connect yourself to my Molty.\n\nInstructions: ${DEV.relay}/skill.md\nDevice: ${DEV.id}\nCode: ${DEV.code}\n\nI'll tap Molty to accept you.`;
const AGENTS = [
  {id:'grok',n:'Grok',ic:'⣿',s1:'In Grok: Customize → MCPs → Add, paste this link',copy1:MCP},
  {id:'claude',n:'Claude',ic:'⣾',s1:'Run this in your terminal',copy1:`claude mcp add --transport http molty ${MCP}`},
  {id:'openclaw',n:'OpenClaw',ic:'⣶',s1:'Add Molty to your agent’s MCP servers',copy1:MCP},
  {id:'other',n:'Something else',ic:'⠿',s1:'Add this MCP server to your agent',copy1:MCP},
];

// ── state ─────────────────────────────────────────
// wifi → pass → joining → creature → agent → agent2 → waiting → tap → done
let S = fresh(), OPT = (location.hash.slice(1)||'A').toUpperCase(), simTimer = 0;
function fresh(){ return {step:(new URLSearchParams(location.search).get('step'))||'wifi', net:null, creature:new URLSearchParams(location.search).get('step')?'cute-duck':null, pickT:-99, agent:new URLSearchParams(location.search).get('step')?'grok':null, copied:{}}; }
const STEP_N = {wifi:0,pass:0,joining:0,creature:1,agent:2,agent2:2,waiting:2,tap:2,done:3};
function go(step, patch={}){ Object.assign(S, patch, {step}); clearTimeout(simTimer);
  if (step==='joining') simTimer = setTimeout(()=>go('creature'), 1600);
  if (step==='waiting') simTimer = setTimeout(()=>go('tap'), 5000);
  if (step==='tap')     simTimer = setTimeout(()=>go('done'), 5000);
  render(); }

// ── tiny dom helper ───────────────────────────────
function h(tag, attrs, ...kids){ const el=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) { if (v==null||v===false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k==='class') el.className=v; else el.setAttribute(k, v===true?'':v); }
  for (const c of kids.flat()) if (c!=null && c!==false) el.append(c.nodeType?c:document.createTextNode(c));
  return el; }

// ── shared step content (same words in every option) ──
function copyBox(key, text){
  const b = h('button',{onclick:()=>{ navigator.clipboard?.writeText(text); S.copied[key]=true; b.textContent='Copied'; b.classList.add('done'); }}, S.copied[key]?'Copied':'Copy');
  if (S.copied[key]) b.classList.add('done');
  return h('div',{class:'copy'}, h('code',null,text), b);
}
const sim = (label, fn) => h('button',{class:'sim',onclick:fn},'mock: '+label);

function content(){
  const a = AGENTS.find(x=>x.id===S.agent);
  switch (S.step) {
  case 'wifi': return { title:'Pick your Wi-Fi', say:'Hi! Which Wi-Fi should I use?', hint:'2.4 GHz networks only',
    body: h('div',{class:'list'}, NETS.map(n=>h('button',{class:'opt',onclick:()=>go(n.lock?'pass':'joining',{net:n.ssid})}, n.ssid, h('span',{class:'meta'},(n.lock?'⠿ ':'')+n.rssi))),
      h('button',{class:'ghost',onclick:()=>go('pass',{net:''})},'Hidden network?')) };
  case 'pass': { const inp=h('input',{type:'password',placeholder:'Password',autofocus:true});
    setTimeout(()=>inp.focus());
    return { title: S.net ? `Password for ${S.net}` : 'Network name & password', say: S.net ? `What’s the password for ${S.net}?` : 'Which network?',
      body: h('div',{class:'list'}, S.net?null:h('input',{placeholder:'Network name'}), inp),
      primary: {label:'Connect', fn:()=>go('joining')}, back:()=>go('wifi') }; }
  case 'joining': return { title:'Connecting…', say:'Connecting…', body: h('div',{class:'wait'},h('span',{class:'spin'},'⠴'),'Joining '+(S.net||'network')) };
  case 'creature': return { stage:true, title:'Choose your Molty', say:'Connected! Now, who should I be?', hint:'Tap one to bring it to life',
    body: h('div',{class:'grid'}, CREATURES.map(c=>h('button',{class:'tile'+(S.creature===c.id?' on':''),onclick:()=>{ S.creature=c.id; STAGE.show(c.id); render(); }}, THUMBS[c.id] ? h('img',{src:THUMBS[c.id],alt:'','data-thumb':c.id}) : h('div',{class:'ph','data-thumb':c.id},'⠴'), h('div',{class:'n'},c.n)))),
    primary:{label: S.creature ? `Choose ${CREATURES.find(c=>c.id===S.creature).n}` : 'Pick one', fn:()=>go('agent'), disabled:!S.creature} };
  case 'agent': { const cb=h('button',{class:'big'+(S.copied.msg?' done':''),onclick:()=>{ navigator.clipboard?.writeText(MSG); S.copied.msg=true; render(); }}, S.copied.msg?'Copied ✓':'Copy message');
    return { title:'Connect your agent', say:'Who will be my brain?', hint:'Send this to Claude, Grok, OpenClaw… it does the rest',
    body: h('div',null,
      h('div',{class:'msg'}, h('pre',null,MSG), cb),
      h('div',{class:'wait'},h('span',{class:'spin'},'⠴'),'Waiting for your agent…'),
      sim('Grok asks to pair', ()=>go('tap',{agent:'grok'})),
      advanced()),
    skip:'Skip for now' }; }
  case 'tap': return { stage:true, title:'Tap Molty to accept', say:'Tap me if you see this code', hint:`${a.n} wants to connect`,
    body: h('div',null, h('div',{class:'wait'},'Same code on Molty? Tap its screen.'), sim('tapped', ()=>go('done'))) };
  case 'done': return { stage:true, title:'All set', say:`I’m ${CREATURES.find(c=>c.id===S.creature)?.n||'Molty'}, and ${a?.n||'my agent'} is my brain.`, hint:'Say hi to Molty',
    body: null, primary:{label:'Open Molty', fn:()=>{}} };
  }
}
function advanced(){
  return h('details',{class:'adv'}, h('summary',null,'Advanced'),
    h('div',{class:'box'}, `device   ${DEV.id}`, h('br'), `code     ${DEV.code}  (rotates every 15 min)`, h('br'), `relay    ${DEV.relay}`, h('br'),
      `cli      molty pair --relay … --device ${DEV.id} --code ${DEV.code}`),
    h('div',{style:'margin-top:10px;color:var(--dim);font-size:13px;text-align:left'},'Agent can’t open links or run code (e.g. a plain chat app)? Add this MCP server in its settings, then send the message:'), copyBox('mcp',MCP));
}
const actions = (c) => [
  c.primary ? h('button',{class:'big',onclick:c.primary.fn,disabled:c.primary.disabled},c.primary.label) : null,
  c.skip ? h('button',{class:'ghost',onclick:()=>go('done')},c.skip) : null,
  c.back ? h('button',{class:'ghost',onclick:c.back},'← Back') : null,
];

// ── A: one card, one question ─────────────────────
function renderA(){
  const c = content(), n = STEP_N[S.step];
  return h('div',{class:'A'},
    h('div',{class:'dots'}, [0,1,2].map(i=>h('i',{class:i<=n?'on':''}))),
    h('h1',null,c.title), c.hint ? h('p',{class:'hint'},c.hint) : h('p',{class:'hint'},' '),
    c.stage ? fstage() : null, c.body, h('div',{class:'foot'}, actions(c)));
}

// ── B: Molty talks (orb mirrors the device) ───────
function renderB(){
  const c = content(), cr = CREATURES.find(x=>x.id===S.creature);
  return h('div',{class:'B'},
    fstage(),
    h('div',{class:'bubble'}, c.say, c.hint ? h('small',null,c.hint) : null),
    h('div',{class:'body'}, c.body, h('div',{style:'margin-top:18px'}, actions(c))),
    h('div',{class:'prog'}, ['Wi-Fi','Molty','Agent'].map((t,i)=>(i<STEP_N[S.step]?'✓ ':i===STEP_N[S.step]?'● ':'○ ')+t).join('   ')));
}

// ── C: checklist, current step open ───────────────
function renderC(){
  const n = STEP_N[S.step], a = AGENTS.find(x=>x.id===S.agent), cr = CREATURES.find(x=>x.id===S.creature);
  const rows = [
    {t:'Wi-Fi', s: S.net && n>0 ? S.net : '', to:'wifi'},
    {t:'Molty', s: cr && n>1 ? cr.n : '', to:'creature'},
    {t:'Agent', s: a && n>2 ? a.n : '', to:'agent'},
  ];
  const c = content();
  return h('div',{class:'C'},
    h('h1',null, n>=3 ? 'Molty is ready' : 'Set up your Molty'),
    h('p',{class:'top'}, n>=3 ? 'Say hi.' : `${3-n} quick step${3-n>1?'s':''}`),
    rows.map((r,i)=>{
      const st = i<n ? 'done' : i===n ? 'here' : 'todo';
      return h('div',{class:'step '+st},
        h('div',{class:'hd'}, h('b',null, st==='done'?'✓':String(i+1)), h('span',{class:'t'},r.t),
          st==='done' ? h('span',{class:'s'},r.s) : null,
          st==='done' ? h('button',{class:'edit',onclick:()=>go(r.to)},'Change') : null),
        st==='here' ? h('div',{class:'bd'}, h('div',{class:'q'}, c.title + (c.hint?' · '+c.hint:'')), c.stage ? fstage() : null, c.body, h('div',{style:'margin-top:16px'}, actions(c))) : null);
    }));
}

// ── shell ─────────────────────────────────────────
const OPTS = {
  A:{label:'A · One card', why:'One question per screen, big title, one button. Progress bar on top. Nothing else on the page.', r:renderA},
  B:{label:'B · Molty talks', why:'A round Molty on top (mirrors the device) asks each question in a speech bubble. Same steps as A, warmer.', r:renderB},
  C:{label:'C · Checklist', why:'One page, three steps. Only the current one is open; finished ones collapse to ✓ + what you chose.', r:renderC},
};
function render(){
  const sw = document.getElementById('switch');
  sw.replaceChildren(...Object.entries(OPTS).map(([k,o])=>h('button',{class:k===OPT?'on':'',onclick:()=>{OPT=k; render();}},o.label)),
    h('button',{class:'reset',onclick:()=>go('wifi',fresh())},'↺ restart'));
  document.getElementById('why').textContent = OPTS[OPT].why;
  const sc = document.querySelector('.grid')?.scrollTop;
  document.getElementById('stage').replaceChildren(OPTS[OPT].r());
  if (sc) document.querySelector('.grid').scrollTop = sc;
  syncStage();
}
// ── the real Molty screen: one persistent fluid stage, moved into whichever layout ──
const STAGE = new FluidStage(248);
function fstage(){ return h('div',{class:'fstage'}, STAGE.el); }
let stageKey = '';
function syncStage(){
  const key = S.step==='tap' ? 'code' : (S.creature||'blob');
  if (key===stageKey) return; stageKey = key;
  if (key==='code') STAGE.word('4821'); else if (S.creature) STAGE.show(S.creature); else STAGE.blob();
}
renderThumbs((id,url)=>{ THUMBS[id]=url;
  document.querySelectorAll(`[data-thumb="${id}"]`).forEach(el=>{ const im=h('img',{src:url,alt:'','data-thumb':id}); el.replaceWith(im); }); });
render();
</script>
</body>
</html>
