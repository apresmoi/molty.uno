name: CI

# Every component, in parallel jobs. The only ordering is console → firmware and
# console → console-e2e: the console page is baked into the firmware's SPIFFS
# image, so firmware builds the exact dist/index.html this run built and tested
# rather than rebuilding it in an image that has no Node. The firmware builds once
# per board: the matrix is every device/firmware/boards/**/board.json (boards job).
#
#   hygiene    relay    cli    creatures    website    firmware-test
#   console ──┬── firmware (one per board) ── boards
#             └── console-e2e

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared by the console/relay/website jobs. Matches docs/HARDWARE.md.
  PNPM_VERSION: 11.22.0
  NODE_VERSION: 22

jobs:
  hygiene:
    name: hygiene (secrets, local paths, licences, version)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Tracked files only: no local paths (/Users/…), no keys or tokens, no .env /
      # .dev.vars, LICENSE + THIRD_PARTY_NOTICES.md present, VERSION copies agree.
      - name: Repository hygiene
        run: tools/scripts/hygiene.sh

  console:
    name: console (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: device/console/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: device/console
        run: pnpm install --frozen-lockfile

      # `pnpm run build` = tsc --noEmit && vitest run && vite build && size report.
      - name: Typecheck, test and build
        working-directory: device/console
        run: pnpm run build

      - name: Upload console page
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-dist
          path: device/console/dist/index.html
          if-no-files-found: error
          retention-days: 7

  console-e2e:
    name: console e2e (Playwright vs mock device)
    needs: console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: device/console/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: device/console
        run: pnpm install --frozen-lockfile

      # The page the console job built and unit-tested, not a rebuild.
      - name: Download console page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: console-dist
          path: device/console/dist

      # Browsers are keyed on the exact Playwright version in the lockfile. System
      # libraries are not in the cache, so a hit still needs install-deps.
      - name: Read Playwright version
        id: playwright
        working-directory: device/console
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: device/console
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: device/console
        run: pnpm exec playwright install-deps chromium

      - name: Walk-through against the mock device
        run: make console-e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-e2e-screenshots
          path: device/console/e2e-out
          if-no-files-found: ignore
          retention-days: 7

  boards:
    name: firmware boards (wiring check, build matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.boards.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Every board.json is consistent with Kconfig, its sdkconfig.board and board.c;
      # the matrix is [{board: <vendor>/<model>, name}] (docs/PORTING.md).
      - name: Check boards and list the matrix
        id: boards
        run: |
          python3 tools/scripts/firmware-boards.py check
          echo "matrix=$(python3 tools/scripts/firmware-boards.py matrix)" >> "$GITHUB_OUTPUT"

  firmware:
    name: firmware ${{ matrix.name }} (ESP-IDF build, size)
    needs: [console, boards]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.boards.outputs.matrix) }}
    # espressif/idf:v5.5 is a moving tag (it follows v5.5.x); the digest freezes the
    # exact toolchain. Bump it deliberately: docker buildx imagetools inspect espressif/idf:v5.5
    container:
      image: espressif/idf:v5.5@sha256:00e94c6ff8bc1f7bd22b234ff43db3f3056cb33dedac6819df9fbedbcb5c6ebb
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # stage_console_html.cmake fails the build without device/console/dist/index.html.
      - name: Download console page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: console-dist
          path: device/console/dist

      # GitHub replaces the image's entrypoint, so every step sources export.sh itself.
      # Own build dir + sdkconfig per board (device/firmware/build/<name>/); checks the image tag.
      - name: Build
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          tools/scripts/firmware-build.sh "${{ matrix.board }}"

      - name: App size vs OTA slot (fail above 90%)
        run: tools/scripts/firmware-size.sh "device/firmware/build/${{ matrix.name }}" "${{ matrix.name }}"

      - name: Upload firmware images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.name }}-${{ github.sha }}
          path: |
            device/firmware/build/${{ matrix.name }}/molty.bin
            device/firmware/build/${{ matrix.name }}/molty.elf
            device/firmware/build/${{ matrix.name }}/bootloader/bootloader.bin
            device/firmware/build/${{ matrix.name }}/partition_table/partition-table.bin
            device/firmware/build/${{ matrix.name }}/ota_data_initial.bin
            device/firmware/build/${{ matrix.name }}/spiffs.bin
            device/firmware/build/${{ matrix.name }}/flash_args
          if-no-files-found: error
          retention-days: 14

  firmware-test:
    name: firmware host tests (fluid goldens, cute runtime, agent link)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The link tests compile cJSON from ESP-IDF: same pinned image as the builds.
    container:
      image: espressif/idf:v5.5@sha256:00e94c6ff8bc1f7bd22b234ff43db3f3056cb33dedac6819df9fbedbcb5c6ebb
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # LINK_TEST_CFLAGS lives in the Makefile target: glibc hides strdup under -std=c11.
      - name: Host tests
        run: make firmware-test

  relay:
    name: relay (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: services/relay/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/relay
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: services/relay
        run: pnpm typecheck

      - name: Test
        working-directory: services/relay
        run: pnpm test

      # Bundles exactly what `pnpm run deploy` would ship (version baked in) without
      # deploying: catches wrangler config and bundling errors before a release.
      - name: Bundle (wrangler dry run)
        working-directory: services/relay
        run: pnpm run deploy --dry-run --outdir "$RUNNER_TEMP/relay-bundle"

  cli:
    name: cli (vet, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: Check formatting
        working-directory: apps/cli
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed (run 'make -C apps/cli fmt'):"; echo "$unformatted"; exit 1
          fi

      - name: Go vet
        working-directory: apps/cli
        run: go vet ./...

      - name: Go test
        working-directory: apps/cli
        run: go test ./...

      - name: Build
        run: make cli && apps/cli/bin/molty --version

  creatures:
    name: creatures (.molty export is committed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Re-export creatures
        run: make creatures

      # Content-based: the exporter is deterministic, so any byte change (or a new
      # file) means a spec changed without its .molty being re-exported.
      - name: Verify the committed .molty files match their specs
        run: |
          git diff --exit-code -- device/creatures/molty \
            || { echo "::error::device/creatures/molty is stale — run 'make creatures' and commit the result"; exit 1; }
          untracked="$(git ls-files --others --exclude-standard -- device/creatures/molty)"
          if [ -n "$untracked" ]; then
            echo "::error::new .molty files not committed:"; echo "$untracked"; exit 1
          fi

  website:
    name: website (check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Every later step is skipped (not failed) on a branch without apps/website/.
      - name: Report missing website
        if: hashFiles('apps/website/package.json') == ''
        run: echo "::notice::apps/website/ not present on this ref; skipping"

      - name: Set up pnpm
        if: hashFiles('apps/website/package.json') != ''
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        if: hashFiles('apps/website/package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install dependencies
        if: hashFiles('apps/website/package.json') != ''
        working-directory: apps/website
        run: pnpm install --frozen-lockfile

      - name: Check
        if: hashFiles('apps/website/package.json') != ''
        working-directory: apps/website
        run: pnpm check

      # /setup's board matcher against the real device/firmware/boards/**/board.json
      - name: Test
        if: hashFiles('apps/website/package.json') != ''
        working-directory: apps/website
        run: pnpm test

      - name: Build
        if: hashFiles('apps/website/package.json') != ''
        working-directory: apps/website
        run: pnpm build
