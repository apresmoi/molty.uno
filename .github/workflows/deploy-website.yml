name: Deploy Website

# Builds apps/website/ (Astro + Starlight) and publishes it to GitHub Pages at molty.uno.
# The custom domain comes from apps/website/public/CNAME, which Astro copies into dist/.
# Repo settings: Pages → Source = "GitHub Actions"; DNS for molty.uno points at Pages.
#
# The site imports the real creature engine and .molty files, the console catalog,
# and syncs repo docs (apps/website/src/config/docs.mjs), so changes there redeploy too.
#
# /setup flashes boards from the browser (ESP Web Tools), which needs the firmware on
# this origin: release assets have no CORS. So the build stages the latest release's
# per-board factory images (apps/website/scripts/stage-firmware.mjs). release.yml calls this
# workflow after publishing, so a new release reaches /setup without a manual run.

on:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "device/creatures/**"
      - "docs/**"
      - "device/console/src/catalog/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "device/firmware/boards/**/board.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy molty.uno
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/website
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: apps/website
        run: pnpm check

      - name: Test
        working-directory: apps/website
        run: pnpm test

      # Per-board factory images + ESP Web Tools manifests into public/firmware/. No
      # release yet (or no image for a board): manifests only, and /setup says so.
      - name: Stage firmware for /setup
        working-directory: apps/website
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm stage-firmware --release

      - name: Build
        working-directory: apps/website
        run: pnpm build

      # Without CNAME in the artifact, Pages drops the custom domain on deploy.
      - name: Verify custom domain
        run: |
          test "$(tr -d '[:space:]' < apps/website/dist/CNAME)" = "molty.uno" \
            || { echo "::error::apps/website/dist/CNAME must contain molty.uno (apps/website/public/CNAME)"; exit 1; }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: apps/website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
