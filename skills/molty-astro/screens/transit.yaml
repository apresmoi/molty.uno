# yaml-language-server: $schema=../../../schema/display-2-screen.json
about: Mercury or Venus crossing the face of the Sun.
duration: 6
inputs:
  path:
    type: list
    max: 14
    about: "The planet against the Sun in 14 steps, sampled evenly from 15 percent before the transit starts to 15 percent after it ends. Scale: 0.55 over the Sun's angular radius."
    of:
      x: { type: number, min: -2, max: 2, about: "Offset on the sky from the still body, east to the left." }
      y: { type: number, min: -2, max: 2, about: "Offset on the sky from the still body, north up." }
      from: { type: seconds, sent_as: "on", about: "When this step shows: 0.3 + 5.4 i / 14 for step i." }
      until: { type: seconds, sent_as: "off", about: "When the next step takes over (the last one: 6)." }
    example:
      - { x: -0.66, y: 0.07, from: 0.3, until: 0.69 }
      - { x: -0.58, y: 0.1, from: 0.69, until: 1.07 }
      - { x: -0.5, y: 0.14, from: 1.07, until: 1.46 }
      - { x: -0.42, y: 0.17, from: 1.46, until: 1.84 }
      - { x: -0.33, y: 0.21, from: 1.84, until: 2.23 }
      - { x: -0.25, y: 0.25, from: 2.23, until: 2.61 }
      - { x: -0.17, y: 0.28, from: 2.61, until: 3 }
      - { x: -0.09, y: 0.32, from: 3, until: 3.39 }
      - { x: -0.01, y: 0.35, from: 3.39, until: 3.77 }
      - { x: 0.07, y: 0.39, from: 3.77, until: 4.16 }
      - { x: 0.16, y: 0.42, from: 4.16, until: 4.54 }
      - { x: 0.24, y: 0.46, from: 4.54, until: 4.93 }
      - { x: 0.32, y: 0.5, from: 4.93, until: 5.31 }
      - { x: 0.4, y: 0.53, from: 5.31, until: 6 }
draw:
  - globe: { radius: 0.55, map: sun, spin: 6 }
  # draw before for: keeps this item as the package always had it (docs/DISPLAY.md, "Moving from v1")
  - draw:
      - dot: { at: { x: "{{ step.x }}", y: "{{ step.y }}" }, show: { from: "{{ step.from }}", until: "{{ step.until }}" }, radius: 0.05, color: erase }
    for: step in path
