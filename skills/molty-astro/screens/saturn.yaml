# yaml-language-server: $schema=../../../schema/display-2-screen.json
about: Saturn as a lit globe inside its rings, tilted as they are seen tonight.
duration: 2.5
inputs:
  lit:
    type: amount
    about: The fraction of its disc that is lit.
    example: 0.999
  lit_side:
    type: number
    sent_as: side
    min: -1
    max: 1
    about: 1 when Saturn is east of the Sun (lit on the right), else -1.
    example: 1
  rings:
    type: asset
    of: assets/rings
    about: "The ring tilt seen from Earth: rings-p<t> for a tilt of 0 or more, rings-n<t> below 0, t the nearest of 3, 9, 15, 21, 27 degrees."
    example: rings-p9
draw:
  # the rings' far half behind the ball (turned half a turn), the near half in front
  - symbol: { size: 1.462, asset: "{{ rings }}", rotate: 180, color: ring_gold }
  - globe: { radius: 0.34, map: saturn, lit: "{{ lit }}", lit_side: "{{ lit_side }}", spin: 17 }
  - symbol: { size: 1.462, asset: "{{ rings }}", rotate: 0, color: ring_gold }
