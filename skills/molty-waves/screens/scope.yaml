about: The chord Molty plays, on one circle, from the speaker's own clock. Tap the centre to play and to stop; stopped, turn the rim to choose a chord, heard at the pitch it last played; playing, turn it for the pitch (a detent on each note) and tap a number up top to mute that voice.
duration: hold
draw:
  # one circle: each voice's hits as dots joined as its shape, the hand, the outline the sound pushes out
  - wave_ring: { radius: 0.5 }
  # playing: the rim is the pitch, a click every 6 degrees: 25 cents to C5 (a turn an octave, a firmer tick and a
  # click's hold on each note), a semitone to C6, a whole tone above; fast, an octave. Its own tick is the fine step's
  - wheel: { id: pitch, sets: pitch, step: 6, tick_ms: 15, tick: 50 }
  # stopped: the rim chooses the chord kind, one bead every 30 degrees, each previewed at the pitch
  - wheel: { id: chord, sets: pick, step: 30, face: 1 }
  # the centre: plays, and stops to the chooser
  - centre_tap: { radius: 0.26 }
