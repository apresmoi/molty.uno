# molty-voice next to an existing moshi-server deployment (STT on :8090, TTS on :8089 on
# this host). Pair once on the host first (`molty-voice pair ...`): the config with the
# token is mounted read-only. Host networking so 127.0.0.1 reaches moshi-server.
services:
  molty-voice:
    image: python:3.12-slim
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./:/src:ro                                   # this voicebox/ directory
      - ${HOME}/.config/molty-voice:/config:ro
    environment:
      XDG_CONFIG_HOME: /config-root
    command: >
      sh -c "mkdir -p /config-root && ln -sfn /config /config-root/molty-voice &&
             pip install --no-cache-dir -q /src && exec molty-voice run"
