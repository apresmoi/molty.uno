# The fifth live run of the voice front (2026-11-27, research/voice-front-live/turn5-*), as a script:
# `cd tools/sim && .venv/bin/molty-sim front --script scenarios/front-run5.yaml`
#
# The agent ("Dude") answers EVERY utterance 9 to 14 s later with a chatty line in_reply_to that turn,
# once a retry. What went wrong live, and what each turn here sets off:
#   turn 1  the front answers a greeting itself; Dude's own greeting for it comes 13 s later, while the
#           person is on turn 2 (live: it was voiced, as the answer to turn 2)
#   turn 2  the model ends the turn and its own auto response comes late (auto_create_ms): live, turn
#           detection went off at the listen's end first and no reply ever came
#   turn 3  a short, pitchless turn the model takes for speech: live, the relay's own voice check said
#           nobody spoke and ended the conversation as idle under the front's reply
#   turn 4  a real question: the front hands it off; Dude's answer comes 9 s later and is the one agent
#           line that may be voiced
name: run5
first_audio_ms: 2500
turns:
  - heard: "hey molty, how is it going"
    front: answer
    said: "Hey, just hanging out, listening for your cues. What's on your mind?"
    pause_s: 0.5
    agent:
      - after_s: 13
        say: "Just lounging on your desk like a proper cat, Juan. What are you up to tonight?"
  - heard: "it seems that you are speaking twice"
    front: answer
    said: "Hmm, sorry about that. Go on?"
    pause_s: 3.0
    auto_create_ms: 400
    agent:
      - after_s: 12
        say: "Mrrp, I am listening."
      - after_s: 16
        say: "Mrrp, I am listening."
  - heard: "mm"
    front: answer
    said: "Okay, let me hear what you want to ask or share."
    pause_s: 0.4
    speech_s: 0.7
    voiced: false
    agent:
      - after_s: 9
        say: "Purring along nicely, still here on your desk."
  - heard: "what is on my calendar today?"
    front: handoff
    said: "Ok, let me see... your calendar for today, one sec."
    pause_s: 1.0
    agent:
      - after_s: 9
        say: "You have the team standup at ten and the dentist at three."
