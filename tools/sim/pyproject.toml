[project]
name = "molty-sim"
version = "0.1.0"
description = "Simulated Molty: drives the real device wire protocol against a relay + voice box to measure the conversation loop."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "websockets>=14",
  "msgpack>=1.0",
  "numpy>=1.26",
  "pyyaml>=6",
  "molty-voice",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
molty-sim = "molty_sim.cli:main"

[tool.uv.sources]
molty-voice = { path = "../../services/molty-voice", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["molty_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
